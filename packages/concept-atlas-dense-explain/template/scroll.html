<!doctype html>
<html lang="zh-CN" data-carrier="scroll">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📃%3C/text%3E%3C/svg%3E" />
    <title>Concept Atlas · 连续阅读示例</title>
    <script>
      (function () {
        var doc = document.documentElement;
        var stored = null;
        var legacy = null;
        // Storage access itself can throw (private mode); never let the
        // anti-flash script crash before first paint.
        try {
          stored = JSON.parse(localStorage.getItem('concept_atlas_appearance') || 'null');
          legacy = localStorage.getItem('concept_atlas_scroll_theme');
        } catch (e) {}
        // Placeholders are replaced at build time when --skin/--default-mode
        // (or CONCEPT_ATLAS_* env vars) are configured; otherwise the runtime
        // fallbacks below keep the carrier defaults.
        var skin = '__ATLAS_DEFAULT_SKIN__';
        if (/^__.+__$/.test(skin)) skin = 'aurora';
        var mode = '__ATLAS_DEFAULT_MODE__';
        if (/^__.+__$/.test(mode)) mode = 'light';
        var style = '__ATLAS_DEFAULT_STYLE__';
        if (/^__.+__$/.test(style)) style = 'manuscript';
        // Stored values are whitelisted so a corrupt payload can't paint a
        // frame with an unknown skin/style before React corrects it.
        var skins = ['aurora', 'ember', 'verdant', 'sakura', 'noir'];
        var styles = ['manuscript', 'classic', 'shadcn', 'elastic'];
        if (stored && (stored.mode === 'light' || stored.mode === 'dark')) {
          mode = stored.mode;
        } else if (mode !== 'light' && mode !== 'dark') {
          mode = legacy === 'light' || legacy === 'dark' ? legacy : 'light';
        }
        if (stored && skins.indexOf(stored.skin) >= 0) skin = stored.skin;
        if (stored && styles.indexOf(stored.style) >= 0) style = stored.style;
        doc.setAttribute('data-skin', skin);
        doc.setAttribute('data-theme', mode);
        doc.setAttribute('data-style', style);
      })();
    </script>
    <!-- Google Fonts for the scroll carrier's type stack (same set as index.html) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Lora:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@500;600;700;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/scroll-main.jsx"></script>
  </body>
</html>

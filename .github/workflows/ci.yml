name: CI

on:
  push:
    branches: [master]
  pull_request:

# A push that supersedes an in-flight run cancels the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Generated package files must match src/; a drifted template only breaks
      # after publish, so fail the push here.
      - name: Check template sync
        run: npm run check:sync

      - name: Validate example content
        run: npm run validate

      - name: Audit dead CSS
        run: npm run audit:css

      - name: Run tests
        run: npm test

      - name: Build demo pages
        run: npm run build
